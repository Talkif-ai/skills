name: Publish to the MCP Registry

# Lists the Talkif MCP server (server.json) in the official MCP Registry under
# io.github.Talkif-ai. Runs on a release tag; the tag sets the listed version.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC proves the Talkif-ai namespace to the registry
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Set the version from the tag
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.version = $v' server.json > server.tmp
          mv server.tmp server.json

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
